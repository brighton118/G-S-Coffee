name: Deploy to Firebase Hosting

'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GitHub secret 'FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022' is missing or empty!"
            echo "Please go to https://github.com/brighton118/G-S-Coffee/settings/secrets/actions"
            echo "Add a new repository secret with Name: FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022"
            echo "and paste the Firebase Service Account JSON key as the Secret value."
            exit 1
          fi

          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx firebase-tools deploy --only hosting --non-interactive --project gs-coffee-3d022
