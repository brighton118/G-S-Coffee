name: Deploy to Firebase Hosting

'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 }}
        run: |
          sudo npm install -g firebase-tools
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying using FIREBASE_TOKEN..."
            firebase deploy --only hosting --project gs-coffee-3d022 --token "$FIREBASE_TOKEN"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying using Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            firebase deploy --only hosting --project gs-coffee-3d022 --non-interactive
          else
            echo "::error::Neither FIREBASE_TOKEN nor FIREBASE_SERVICE_ACCOUNT is available in GitHub Secrets."
            exit 1
          fi
