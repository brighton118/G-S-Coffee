name: Deploy to Firebase Hosting

'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 }}
        run: |
          node -e '
            const sa = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (!sa || !sa.trim()) {
              console.error("::error::The secret FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 is empty in GitHub repository settings.");
              process.exit(1);
            }
            try {
              JSON.parse(sa);
              require("fs").writeFileSync(process.env.RUNNER_TEMP + "/service-account.json", sa);
              console.log("Service account JSON successfully parsed and written.");
            } catch (err) {
              console.error("::error::The secret FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 is not valid JSON. Error: " + err.message);
              process.exit(1);
            }
          '
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx firebase-tools deploy --only hosting --non-interactive --project gs-coffee-3d022
