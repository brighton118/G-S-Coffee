name: Deploy to Firebase Hosting

'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 }}
        run: |
          node -e '
            const fs = require("fs");
            const sa = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (!sa || sa.trim().length === 0) {
              console.log("::error::FIREBASE_SERVICE_ACCOUNT_GS_COFFEE_3D022 is empty in GitHub Secrets!");
              process.exit(1);
            }
            try {
              JSON.parse(sa);
              fs.writeFileSync(process.env.RUNNER_TEMP + "/sa.json", sa, "utf8");
              console.log("::notice::Service account JSON successfully parsed.");
            } catch (e) {
              console.log("::error::Secret in GitHub is not valid JSON: " + e.message);
              process.exit(1);
            }
          '

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          sudo npm install -g firebase-tools

          firebase deploy --only hosting --project gs-coffee-3d022 --non-interactive
